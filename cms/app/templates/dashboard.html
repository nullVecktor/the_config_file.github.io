
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>THE_CONFIG_FILE | Dashboard</title>
</head>
<body>
    <main>
        <h1>THE_CONFIG_FILE</h1>
        <p>Panel de administración de publicaciones.</p>

        <section>
            <h2>Artículos</h2>

            {% if posts %}
                <ul>
                    {% for post in posts %}
                        <li>
                            <strong>{{ post.stem }}</strong>
                            <small>{{ post.name }}</small>
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p>Todavía no hay artículos Markdown.</p>
            {% endif %}
        </section>
    </main>
</body>
</html>
