
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} // {% endif %}{{ site.title }}</title>

  <meta name="description"
        content="{{ page.description | default: site.description | escape }}">

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">

  <link rel="alternate"
        type="application/atom+xml"
        title="{{ site.title }}"
        href="{{ '/feed.xml' | relative_url }}">
</head>

<body>
  <!-- Escena del hacker: permanece fija durante el scroll -->
  <div class="fixed-scene" aria-hidden="true"></div>

  <header class="site-header">
    <a class="icon-link"
       href="{{ '/' | relative_url }}"
       aria-label="Ir al inicio">
      <span class="menu-glyph" aria-hidden="true">☰</span>
    </a>

    <a class="wordmark" href="{{ '/' | relative_url }}">
      THE<span>_</span>CONFIG_FILE
    </a>

    <a class="icon-link search-link"
       href="{{ '/feed.xml' | relative_url }}"
       aria-label="Consultar el feed RSS">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="6.5"></circle>
        <path d="m16 16 4.5 4.5"></path>
      </svg>
    </a>
  </header>

  <main class="content-panel">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>ALL SYSTEMS NOMINAL</span>
    <span>THE_CONFIG_FILE © {{ site.time | date: "%Y" }}</span>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"
          defer></script>
</body>
</html>
