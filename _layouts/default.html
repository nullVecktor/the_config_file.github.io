<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} // {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">_&gt;</span> THE_CONFIG_FILE</a>
    <nav aria-label="Navegación principal">
      <a href="{{ '/' | relative_url }}">INICIO</a>
      <a href="{{ '/about/' | relative_url }}">ACERCA DE</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a>
    </nav>
  </div>
  <main class="site-shell">
    {{ content }}
  </main>
  <footer class="site-footer">
    <span><span class="status-dot"></span> ALL SYSTEMS NOMINAL</span>
    <span>THE_CONFIG_FILE © {{ site.time | date: "%Y" }}</span>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
